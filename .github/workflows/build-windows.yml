name: Build Windows EXE

on:
  push:
    branches:
      - feat/merge-batch-and-ci-from-1.3.5
      - optimize-parallel-and-build
  workflow_dispatch:
    inputs:
      branch:
        description: '构建的分支名称'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path launcher.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build_exe.ps1 -Python ((Get-Command python).Source) -SkipInstall

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: VideoToNo-windows-x64-${{ steps.version.outputs.version }}
          path: dist/VideoToNo-${{ steps.version.outputs.version }}-portable.exe
          if-no-files-found: error
          retention-days: 14
